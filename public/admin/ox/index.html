<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=no">
<title>OX게임 질문 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="questions" data-game-type="ox" class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <span class="font-bold">⭕❌ OX게임 질문</span>
    <a href="../" class="text-xs px-3 py-2 rounded-lg bg-slate-800 active:bg-slate-700 min-h-[44px] inline-flex items-center">← 어드민</a>
  </header>
  <main class="flex-1 px-4 py-4 space-y-4">
    <section>
      <h3 class="text-sm font-semibold text-emerald-400 mb-2">NEW</h3>
      <div id="list-new" class="space-y-2"></div>
    </section>
    <section>
      <h3 class="text-sm font-semibold text-slate-500 mb-2">COMPLETE</h3>
      <div id="list-complete" class="space-y-2"></div>
    </section>
    <section>
      <h3 class="text-sm font-semibold text-slate-500 mb-2">HIDDEN</h3>
      <div id="list-hidden" class="space-y-2"></div>
    </section>
  </main>
</div>
<script src="../../assets/js/admin.js"></script>
</body>
</html>
