<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=no">
<title>어드민 - 파티게임</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="groups" class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <span class="text-lg font-bold">🎮 어드민</span>
    <span class="flex gap-2">
      <a href="users/" class="text-xs px-3 py-2 rounded-lg bg-slate-800 active:bg-slate-700 min-h-[44px] inline-flex items-center">👥 유저</a>
      <a href="../" class="text-xs px-3 py-2 rounded-lg bg-slate-800 active:bg-slate-700 min-h-[44px] inline-flex items-center">← 유저 페이지</a>
    </span>
  </header>
  <main class="flex-1 px-4 py-4 space-y-4">
    <section class="bg-slate-900 rounded-2xl p-4 space-y-3">
      <h2 class="font-semibold text-base">그룹 만들기</h2>
      <input id="g-name" type="text" maxlength="100" placeholder="그룹명 (예: 송년회)"
        class="w-full min-h-[52px] px-4 rounded-xl bg-slate-800 border border-slate-700 text-base outline-none focus:border-indigo-500">
      <textarea id="g-participants" rows="4" placeholder="참가자 이름 (한 줄에 한 명)&#10;이미지게임 투표 후보로 사용됩니다"
        class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-base outline-none focus:border-indigo-500"></textarea>
      <button id="btn-create" class="w-full min-h-[52px] rounded-xl bg-indigo-600 active:bg-indigo-500 font-semibold">그룹 만들기</button>
    </section>
    <section class="space-y-3">
      <h2 class="font-semibold text-base text-slate-300">그룹 목록</h2>
      <div id="group-list" class="space-y-3"></div>
    </section>
  </main>
</div>
<script src="../assets/js/admin.js"></script>
</body>
</html>
